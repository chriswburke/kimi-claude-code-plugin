name: Kimi provider canary

on:
  workflow_dispatch:
    inputs:
      kimi_model:
        description: Kimi model name for the temporary environment channel
        required: true
        default: kimi-for-coding
        type: string

permissions:
  contents: read

concurrency:
  group: kimi-provider-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # RUNNER_TEMP is read from the environment because the runner context is
      # not available in job-level env, which fails the whole file at parse time.
      CLAUDE_PLUGIN_DATA: ${{ github.workspace }}/.canary-state
      MODEL_COMPANION_PROJECT_DIR: ${{ github.workspace }}
      KIMI_CODE_HOME: ${{ github.workspace }}/.canary-kimi-home
      KIMI_DISABLE_TELEMETRY: "1"
      KIMI_CODE_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Require the Kimi secret
        env:
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
        run: test -n "$KIMI_MODEL_API_KEY"
      - name: Install Kimi Code
        # Pinned because this job runs the package with KIMI_MODEL_API_KEY in
        # its environment. Bump deliberately after reviewing the new release.
        run: npm install --global @moonshot-ai/kimi-code@0.29.2
      - name: Check Kimi setup and models
        env:
          KIMI_MODEL_NAME: ${{ inputs.kimi_model }}
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_MAX_COMPLETION_TOKENS: "512"
        run: |
          node plugins/kimi/scripts/companion.mjs setup --json
          node plugins/kimi/scripts/companion.mjs models --json
      - name: Run a bounded Kimi plan
        env:
          KIMI_MODEL_NAME: ${{ inputs.kimi_model }}
          KIMI_MODEL_API_KEY: ${{ secrets.KIMI_MODEL_API_KEY }}
          KIMI_MODEL_MAX_COMPLETION_TOKENS: "512"
        run: >-
          node plugins/kimi/scripts/companion.mjs run plan
          --model "$KIMI_MODEL_NAME" --timeout 2m
          "Return a three-item read-only plan for checking this repository."
