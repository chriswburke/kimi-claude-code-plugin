name: Release checks

# The full matrix, packaging, and the pinned minimum Claude Code version. These
# live outside CI so they do not appear as skipped jobs on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-matrix:
    name: release (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["18.18.0", "20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # setup-node installs into a group- or world-writable tool cache. The
      # contract tests require a Node launcher whose whole ancestor chain is
      # trusted, matching what the runtime enforces for a provider executable.
      - name: Trust the Node toolchain directory chain
        run: |
          target="$(readlink -f "$(command -v node)")"
          sudo chmod go-w "$target" || true
          directory="$(dirname "$target")"
          while [ "$directory" != "/" ]; do
            sudo chmod go-w "$directory" || true
            directory="$(dirname "$directory")"
          done
      - run: npm run release:check

  release-strict-validation:
    name: Strict validation (Claude ${{ matrix.claude-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        claude-version: ["2.1.169", "latest"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@${{ matrix.claude-version }}"
      - run: npm run validate
      - name: Smoke-test local marketplace install and independent upgrade
        if: ${{ matrix.claude-version == 'latest' }}
        run: npm run test:claude-smoke
