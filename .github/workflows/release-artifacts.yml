name: Build release artifacts

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Verify manual or tagged release target
        run: node scripts/verify-release-target.mjs "$RELEASE_TAG"
      - run: npm install --global @anthropic-ai/claude-code@2.1.169
      - name: Run the full strict release gate
        run: npm run release:check:strict
      - name: Build archive and checksum
        run: node scripts/release-checksums.mjs --output release
      - name: Verify archive checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Attest release archive
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: model-companions-kimi
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error
