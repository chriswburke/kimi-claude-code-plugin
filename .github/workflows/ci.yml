name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run. Without this the
# queue fills faster than the free runner pool drains it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane on every push and pull request. Windows is not covered: its
  # suite has never passed, because the tests assert POSIX file modes and
  # POSIX state paths. The Windows runtime paths stay in the code but are
  # unverified, so the documentation calls them untested.
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18.18.0", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # setup-node installs into /opt/hostedtoolcache, which the runner image
      # leaves group- or world-writable. The contract tests require a Node
      # launcher whose whole ancestor chain is trusted, matching what the
      # runtime enforces for a provider executable. Tighten the chain here
      # rather than relaxing that check.
      - name: Trust the Node toolchain directory chain
        if: runner.os != 'Windows'
        run: |
          target="$(readlink -f "$(command -v node)")"
          sudo chmod go-w "$target" || true
          directory="$(dirname "$target")"
          while [ "$directory" != "/" ]; do
            sudo chmod go-w "$directory" || true
            directory="$(dirname "$directory")"
          done
          ls -ld "$target" "$(dirname "$target")"
      - run: npm test
      - run: npm run version:check

  strict-validation:
    name: Strict validation (Claude latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --global "@anthropic-ai/claude-code@latest"
      - run: npm run validate
      - name: Smoke-test local marketplace install and independent upgrade
        run: npm run test:claude-smoke
