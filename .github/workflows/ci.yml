name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run. Without this the
# queue fills faster than the free runner pool drains it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lane on every push and pull request. Windows is not covered: its
  # suite has never passed, because the tests assert POSIX file modes and
  # POSIX state paths. The Windows runtime paths stay in the code but are
  # unverified, so the documentation calls them untested.
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["18.18.0", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      # The runner tool cache and Homebrew both install below group- or
      # world-writable directories, which the runtime executable-trust check
      # correctly refuses for a provider or Git binary. Tighten those chains
      # rather than weakening the check.
      - name: Trust the Node and Git toolchain directory chains
        run: |
          for tool in node git; do
            target="$(command -v "$tool")"
            target="$(readlink -f "$target" 2>/dev/null || python3 -c 'import os,sys; print(os.path.realpath(sys.argv[1]))' "$target")"
            sudo chmod go-w "$target" || true
            directory="$(dirname "$target")"
            while [ "$directory" != "/" ]; do
              sudo chmod go-w "$directory" || true
              directory="$(dirname "$directory")"
            done
            ls -ld "$target"
          done
      - run: npm test
      - run: npm run version:check

  strict-validation:
    name: Strict validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # Pinned for supply-chain safety; keep in step with release-artifacts.yml.
      - run: npm install --global "@anthropic-ai/claude-code@2.1.169"
      - run: npm run validate
      - name: Smoke-test local marketplace install and independent upgrade
        run: npm run test:claude-smoke
